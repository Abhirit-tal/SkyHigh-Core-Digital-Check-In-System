spring:
  application:
    name: skyhigh-checkin-integration-test

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true

  cache:
    type: simple

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

skyhigh:
  rabbitmq:
    enabled: false
  checkin:
    seat-hold-duration-seconds: 120
    session-timeout-minutes: 10
    max-baggage-weight-kg: 25
    excess-baggage-fee-per-kg: 200
    checkin-window-opens-hours: 24
    checkin-window-closes-hours: 1
    waitlist-offer-duration-minutes: 5
    waitlist-max-per-flight: 50
    rate-limit-seat-map-max-requests: 50
    rate-limit-seat-map-window-seconds: 2
    rate-limit-block-duration-minutes: 5

jwt:
  secret: test-secret-key-for-jwt-token-generation-minimum-256-bits-required
  access-token-expiration: 7200000
  refresh-token-expiration: 86400000

logging:
  level:
    com.skyhigh: DEBUG
    org.testcontainers: INFO

